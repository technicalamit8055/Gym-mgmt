apply plugin: 'com.android.application'

android {
    namespace = "com.gymbook.member"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gymbook.member"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // A fresh versionCode on every build (minutes since 2024): phone skins
        // like vivo's cache the app icon they draw in notification headers and
        // only reread it when an update's versionCode changes.
        versionCode = ((System.currentTimeMillis() - 1704067200000L).intdiv(60000)) as int
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // One debug key for every PC, so a build from any of them installs over
    // another's on the phone instead of needing an uninstall. The file is not
    // in git; without it, the PC's own ~/.android/debug.keystore signs.
    def sharedDebugKey = file('debug.keystore')
    if (sharedDebugKey.exists()) {
        signingConfigs {
            debug {
                storeFile sharedDebugKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // Two store apps from one web bundle. GymVym serves every business on the
    // server; CoachBook is the students' app, for coaching institutes only. A
    // flavor's src/<flavor>/ holds its name, icons, splash and
    // assets/public/native-app.json, which tells the page which app it is in.
    flavorDimensions = ["app"]
    productFlavors {
        gymvym {
            dimension "app"
            applicationId "com.gymbook.member"
        }
        coachbook {
            dimension "app"
            applicationId "com.gymbook.coachbook"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        // An app not yet added to the Firebase project would fail the whole
        // build. Build it without push instead, until google-services.json is
        // downloaded again with that app in it.
        android.productFlavors.each { flavor ->
            if (!servicesJSON.text.contains("\"${flavor.applicationId}\"")) {
                logger.warn("${flavor.applicationId} is not in google-services.json: the ${flavor.name} app builds without push notifications.")
                tasks.matching { it.name ==~ /process${flavor.name.capitalize()}\w*GoogleServices/ }.configureEach { enabled = false }
            }
        }
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
