<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Nothing loads from outside the app; the only network use is the class
       socket (the YouTube stream leaves from the main process's ffmpeg). -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob: mediastream:; font-src 'self'; connect-src ws: wss:; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoachBook Studio</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="app" class="shell side-right" aria-live="polite"></main>
</body>
</html>
