<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the app paint under the iPhone notch and home
         indicator; app.css pays that back with env(safe-area-inset-*) padding. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GymBook — Gym Management</title>
    <meta name="description" content="Gym management: members, memberships, billing, check-ins, classes, trainers and equipment." />

    <!-- Installed app. js/pwa.js repoints this at /g/<slug>/manifest.webmanifest
         when a gym is addressed by path, so each gym installs as its own app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS ignores the manifest for home-screen installs and reads these. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GymBook" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <!-- Preloaded so first paint is already in Inter rather than swapping from
         the system font a beat later. crossorigin is required for font preloads. -->
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/app.css" />
    <!-- CoachBook's palettes and screens; inert unless body[data-vertical='coaching']
         or one of its own .cb-* components is on the page. -->
    <link rel="stylesheet" href="/css/coaching.css" />
  </head>
  <body>
    <script>
      // The Capacitor member app (android/) always opens on the member portal.
      // Set here, ahead of everything that reads the hash to pick its mode.
      if (window.Capacitor && Capacitor.isNativePlatform() && location.hash.indexOf('#/portal') !== 0) {
        history.replaceState(null, '', '#/portal');
      }
      // Set before first paint so the boot sequence (which awaits network
      // calls before setVertical() runs) never flashes the wrong mode. The
      // member app defaults to light, the staff app to dark (see vertical.js).
      var memberApp = location.hash.indexOf('#/portal') === 0;
      var savedMode = localStorage.getItem(memberApp ? 'member_app_mode' : 'app_mode');
      document.body.dataset.mode =
        savedMode === 'light' || savedMode === 'dark' ? savedMode : memberApp ? 'light' : 'dark';
      // A signed-out member lands on the portal sign-in, which is always
      // black and gold whatever the mode — so the boot splash in front of it
      // goes dark too, rather than flashing white first. Flagged on <html>
      // rather than by flipping body's mode, which boot() resets while the
      // splash is still fading out. Key mirrors MEMBER_TOKEN_KEY in
      // js/api.js (per-gym suffix when the gym is addressed by path).
      var slug = (location.pathname.match(/^\/g\/([a-z][a-z0-9-]{2,39})(?=\/|$)/) || [])[1];
      // The store app keeps its gym on the phone, not in the URL (see
      // gymbook.app.gym in js/api.js). No gym yet means the finder, which is
      // dark too — the empty slug's unscoped key is never set, so it is.
      if (!slug && window.Capacitor && Capacitor.isNativePlatform()) {
        try {
          slug = (JSON.parse(localStorage.getItem('gymbook.app.gym')) || {}).slug;
        } catch (e) {
          slug = undefined;
        }
      }
      if (memberApp && !localStorage.getItem('gymbook.member.token' + (slug ? '.' + slug : ''))) {
        document.documentElement.dataset.splash = 'ink';
      }
      // Members get the gym illustration instead of the neutral tick. The
      // vertical isn't known until /api answers, so this goes on the one
      // setVertical() last saw — a study hall's members see the tick from
      // their second open on. So do an institute's (CoachBook).
      var splashVertical = localStorage.getItem('gymbook.splash.vertical');
      if (memberApp && splashVertical !== 'library' && splashVertical !== 'coaching') {
        document.documentElement.dataset.splashArt = 'gym';
      }
    </script>
    <!-- Boot splash. Painted before boot() knows whether this is a gym or a
         study hall, so it carries no brand colour — only the mode tokens the
         script above has already picked. app.js fades it out as soon as the
         first screen lands in #app; see dismissSplash(). -->
    <div id="splash" class="splash" role="status" aria-live="polite">
      <div class="splash-inner">
        <div class="splash-mark" aria-hidden="true">
          <svg class="splash-ring" viewBox="0 0 96 96">
            <circle class="splash-track" cx="48" cy="48" r="44" />
            <circle class="splash-arc" cx="48" cy="48" r="44" pathLength="100" />
          </svg>
          <div class="splash-tile">
            <svg viewBox="0 0 32 32"><path class="splash-check" d="M8.5 16.5l5 5 10-10.5" pathLength="1" /></svg>
          </div>
        </div>
        <!-- Member app only (data-splash-art). Each item nests three groups:
             the outer one pops in, the middle one loops, the inner one holds
             the item's placement — CSS transforms would otherwise overwrite
             the transform attribute. -->
        <svg class="splash-art" viewBox="0 0 240 200" aria-hidden="true">
          <defs>
            <clipPath id="sp-shaker-clip">
              <path d="M-19 -21h38l-3 61a4 4 0 0 1-4 4h-24a4 4 0 0 1-4-4z" />
            </clipPath>
          </defs>
          <g class="sp-swoosh">
            <path class="sp-s1" d="M58 116q-20 30 10 52" />
            <path class="sp-s2" d="M70 46q22-14 44-10" />
            <path class="sp-s3" d="M194 80q16 26-8 52" />
          </g>
          <g class="sp-sparks">
            <g class="sp-spark sp-k1"><path d="M120 30l-7-6M127 25l-1-10M134 27l5-8" /></g>
            <g class="sp-spark sp-k2"><path d="M44 84l-9-2M46 76l-7-6" /></g>
            <g class="sp-spark sp-k3"><path d="M203 140l8-4M205 148l9 2" /></g>
          </g>
          <ellipse class="sp-shadow sp-sh1" cx="112" cy="180" rx="26" ry="3.5" />
          <ellipse class="sp-shadow sp-sh2" cx="166" cy="180" rx="28" ry="3.5" />

          <g class="sp-pop sp-p1"><g class="sp-loop sp-dumbbell"><g transform="translate(78 86) rotate(-28)">
            <rect class="sp-ink" x="-47" y="-4" width="94" height="8" rx="3" />
            <rect class="sp-ink" x="-42" y="-14" width="10" height="28" rx="4" />
            <rect class="sp-ink" x="32" y="-14" width="10" height="28" rx="4" />
            <rect class="sp-ink" x="-34" y="-21" width="14" height="42" rx="6" />
            <rect class="sp-ink" x="20" y="-21" width="14" height="42" rx="6" />
            <rect class="sp-gold" x="-29" y="-21" width="4" height="42" />
            <rect class="sp-gold" x="25" y="-21" width="4" height="42" />
            <rect class="sp-shine" x="-32" y="-16" width="2" height="12" rx="1" />
            <rect class="sp-shine" x="22" y="-16" width="2" height="12" rx="1" />
          </g></g></g>

          <g class="sp-pop sp-p2"><g class="sp-loop sp-shaker"><g transform="translate(158 62) rotate(12)">
            <path class="sp-glass" d="M-19 -21h38l-3 61a4 4 0 0 1-4 4h-24a4 4 0 0 1-4-4z" />
            <g clip-path="url(#sp-shaker-clip)">
              <path class="sp-liquid" d="M-60 2q10-5 20 0t20 0t20 0t20 0t20 0t20 0V50H-60z" />
            </g>
            <path class="sp-outline" d="M-19 -21h38l-3 61a4 4 0 0 1-4 4h-24a4 4 0 0 1-4-4z" />
            <path class="sp-tick" d="M9 10h6M11 18h4M9 26h6M11 34h4" />
            <rect class="sp-shine" x="-14" y="-15" width="4" height="50" rx="2" />
            <path class="sp-gold" d="M-15 -33q0-12 15-12t15 12z" />
            <rect class="sp-gold" x="-22" y="-34" width="44" height="13" rx="3" />
            <rect class="sp-ink" x="-4" y="-52" width="8" height="8" rx="2" />
            <path class="sp-strap" d="M11 -41q11-8 15 4" />
          </g></g></g>

          <g class="sp-pop sp-p3"><g class="sp-loop sp-apple"><g transform="translate(112 148)">
            <path class="sp-gold" d="M0-14c-6-6-24-6-26 12c-2 16 12 32 20 30c3-1 9-1 12 0c8 2 22-14 20-30c-2-18-20-18-26-12z" />
            <path class="sp-stem" d="M0-14q1-8 4-13" />
            <path class="sp-leaf" d="M3-22c5-10 15-8 17-4c-6 6-13 7-17 4z" />
            <path class="sp-glint" d="M-16-5q-2 10 4 18" />
          </g></g></g>

          <g class="sp-pop sp-p4"><g class="sp-loop sp-jar"><g transform="translate(168 150) rotate(-8)">
            <rect class="sp-ink" x="-22" y="-19" width="44" height="46" rx="8" />
            <rect class="sp-gold" x="-20" y="-31" width="40" height="13" rx="3" />
            <path class="sp-bolt" d="M3-10L-8 5h7l-3 12L8 1H1z" />
            <rect class="sp-shine" x="-17" y="-13" width="3" height="30" rx="1.5" />
          </g></g></g>
        </svg>
        <p class="splash-text">Getting things ready<span class="splash-dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
        <div class="splash-beads" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>
    <div id="app"></div>
    <div id="toasts" class="toasts"></div>
    <div id="modal-root"></div>
    <!-- Filled in only while printing ID cards; see printCards() in js/qrcard.js -->
    <div id="print-root"></div>
    <!-- Before app.js: the manifest link has to be corrected for this gym
         before the browser acts on the one in the markup above. -->
    <script type="module" src="/js/pwa.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
