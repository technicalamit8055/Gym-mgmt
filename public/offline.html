<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <title>Offline — GymBook</title>
    <!-- Self-contained styles: this page is what gets shown when the network is
         gone, so it cannot depend on /css/app.css having been cached. -->
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
        background: radial-gradient(1000px 600px at 15% -10%, rgba(249, 115, 22, 0.16), transparent 60%), #0d1117;
        color: #e6edf5;
        font: 15px/1.6 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      .card {
        width: min(400px, 100%);
        background: #171f2b;
        border: 1px solid #263140;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      img { width: 64px; height: 64px; border-radius: 14px; }
      h1 { margin: 16px 0 8px; font-size: 22px; }
      p { margin: 0 0 20px; color: #8b9bb0; font-size: 14px; }
      button {
        font: inherit;
        font-weight: 600;
        color: #0d1117;
        background: #f97316;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        GymBook needs a connection to load your gym's data. Everything already saved is safe — reconnect
        and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
    <script>
      // Coming back online is the answer to this page, so act on it without
      // making someone find the button.
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
