<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" width="240" height="150" fill="none">
  <defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#93c5fd" stop-opacity=".5"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3b6fd8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#3b6fd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6eeff"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c6fb"/>
      <stop offset="1" stop-color="#6d9af0"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8dff"/>
      <stop offset="1" stop-color="#1d5ee8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f4fc0"/>
      <stop offset=".5" stop-color="#a8c6ff"/>
      <stop offset="1" stop-color="#1f4fc0"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b9bff"/>
      <stop offset="1" stop-color="#1c56e0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb0ff"/>
      <stop offset="1" stop-color="#2a63e6"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="74" r="70" fill="url(#glow)"/>
  <ellipse cx="122" cy="138" rx="58" ry="8" fill="url(#shadow)"/>

  <!-- Burst strokes either side -->
  <g stroke="#2563eb" stroke-width="5" stroke-linecap="round">
    <path d="M44 34l12 12"/>
    <path d="M30 70h16"/>
    <path d="M40 104l12-6"/>
    <path d="M196 34l-12 12"/>
    <path d="M210 70h-16"/>
    <path d="M200 104l-12-6"/>
  </g>

  <g transform="rotate(-6 120 80)">
    <rect x="80" y="26" width="92" height="104" rx="16" fill="url(#side)"/>
    <rect x="72" y="20" width="92" height="104" rx="16" fill="url(#body)"/>
    <path d="M72 36a16 16 0 0 1 16-16h60a16 16 0 0 1 16 16v14H72z" fill="url(#head)"/>
    <rect x="94" y="8" width="9" height="24" rx="4.5" fill="url(#ring)"/>
    <rect x="133" y="8" width="9" height="24" rx="4.5" fill="url(#ring)"/>

    <!-- Dumbbell -->
    <rect x="96" y="83" width="44" height="9" rx="4.5" fill="url(#bar)"/>
    <rect x="84" y="68" width="16" height="39" rx="6" fill="url(#plate)"/>
    <rect x="136" y="68" width="16" height="39" rx="6" fill="url(#plate)"/>
    <rect x="88" y="71" width="4" height="22" rx="2" fill="#fff" fill-opacity=".45"/>
    <rect x="140" y="71" width="4" height="22" rx="2" fill="#fff" fill-opacity=".45"/>
  </g>
</svg>
