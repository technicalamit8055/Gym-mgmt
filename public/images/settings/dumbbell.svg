<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160" height="110" fill="none">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb37a"/>
      <stop offset=".55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#f0611a"/>
    </linearGradient>
    <linearGradient id="plateFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd2ad"/>
      <stop offset="1" stop-color="#ff9a52"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3cc"/>
      <stop offset=".5" stop-color="#ffa261"/>
      <stop offset="1" stop-color="#e8641f"/>
    </linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f97316" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="82" cy="96" rx="62" ry="9" fill="url(#shadow)"/>
  <g transform="rotate(-22 80 58)">
    <!-- bar -->
    <rect x="34" y="52" width="92" height="12" rx="6" fill="url(#bar)"/>
    <rect x="62" y="50" width="36" height="16" rx="6" fill="url(#plate)"/>
    <path d="M66 54h28M66 58h28M66 62h28" stroke="#ffd9bd" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
    <!-- left plates -->
    <rect x="18" y="30" width="16" height="56" rx="7" fill="url(#plate)"/>
    <rect x="21" y="33" width="9" height="50" rx="4.5" fill="url(#plateFace)" opacity=".75"/>
    <rect x="34" y="37" width="12" height="42" rx="6" fill="url(#plate)"/>
    <rect x="36" y="40" width="6" height="36" rx="3" fill="url(#plateFace)" opacity=".7"/>
    <!-- right plates -->
    <rect x="114" y="37" width="12" height="42" rx="6" fill="url(#plate)"/>
    <rect x="116" y="40" width="6" height="36" rx="3" fill="url(#plateFace)" opacity=".7"/>
    <rect x="126" y="30" width="16" height="56" rx="7" fill="url(#plate)"/>
    <rect x="129" y="33" width="9" height="50" rx="4.5" fill="url(#plateFace)" opacity=".75"/>
