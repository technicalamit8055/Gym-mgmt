<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160" height="110" fill="none">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0f172a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="80" cy="100" rx="64" ry="8" fill="url(#shadow)"/>
  <!-- lying stack -->
  <rect x="22" y="80" width="84" height="16" rx="4" fill="url(#sky)"/>
  <rect x="26" y="83" width="76" height="10" rx="2" fill="url(#pages)"/>
  <rect x="22" y="80" width="10" height="16" rx="3" fill="url(#sky)"/>
  <rect x="28" y="64" width="76" height="16" rx="4" fill="url(#amber)"/>
  <rect x="32" y="67" width="68" height="10" rx="2" fill="url(#pages)"/>
  <rect x="94" y="64" width="10" height="16" rx="3" fill="url(#amber)"/>
  <!-- standing books -->
  <rect x="110" y="28" width="18" height="68" rx="4" fill="url(#green)"/>
  <path d="M114 40h10M114 84h10" stroke="#ecfdf5" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  <g transform="rotate(14 138 62)">
    <rect x="130" y="34" width="16" height="62" rx="4" fill="url(#violet)"/>
    <path d="M134 46h8M134 84h8" stroke="#f5f3ff" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  </g>
  <!-- open book on top -->
  <path d="M38 62c10-6 22-6 30 0v-22c-8-6-20-6-30 0z" fill="url(#pages)" stroke="#cbd5e1" stroke-width="1.2"/>
  <path d="M98 62c-10-6-22-6-30 0v-22c8-6 20-6 30 0z" fill="url(#pages)" stroke="#cbd5e1" stroke-width="1.2"/>
  <path d="M44 46c6-3 13-3 18 0M44 52c6-3 13-3 18 0M74 46c5-3 12-3 18 0M74 52c5-3 12-3 18 0" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
  <path d="M36 62c11-5 23-5 32 1 9-6 21-6 32-1" stroke="url(#green)" stroke-width="3" stroke-linecap="round"/>
</svg>
