<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 170" width="220" height="170" fill="none">
  <defs>
    <linearGradient id="calBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="calSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="calHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset=".55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="plateFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0e7ff"/>
      <stop offset=".5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4c1d95" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- floor shadow -->
  <ellipse cx="120" cy="156" rx="96" ry="12" fill="url(#shadow)"/>

  <!-- calendar: depth, body, header -->
  <rect x="82" y="30" width="118" height="116" rx="18" fill="url(#calSide)"/>
  <rect x="76" y="24" width="118" height="116" rx="18" fill="url(#calBody)"/>
  <path d="M76 42a18 18 0 0 1 18-18h82a18 18 0 0 1 18 18v12H76z" fill="url(#calHead)"/>
  <path d="M90 30h70" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>

  <!-- binder rings -->
  <rect x="100" y="10" width="11" height="28" rx="5.5" fill="url(#ring)"/>
  <rect x="159" y="10" width="11" height="28" rx="5.5" fill="url(#ring)"/>

  <!-- day grid -->
  <g fill="#fff">
    <rect x="90" y="66" width="18" height="15" rx="4"/>
    <rect x="114" y="66" width="18" height="15" rx="4"/>
    <rect x="138" y="66" width="18" height="15" rx="4"/>
    <rect x="162" y="66" width="18" height="15" rx="4"/>
    <rect x="90" y="88" width="18" height="15" rx="4"/>
    <rect x="114" y="88" width="18" height="15" rx="4"/>
    <rect x="138" y="88" width="18" height="15" rx="4" fill="#c4b5fd"/>
    <rect x="162" y="88" width="18" height="15" rx="4"/>
    <rect x="90" y="110" width="18" height="15" rx="4"/>
    <rect x="114" y="110" width="18" height="15" rx="4"/>
    <rect x="138" y="110" width="18" height="15" rx="4"/>
    <rect x="162" y="110" width="18" height="15" rx="4"/>
  </g>

  <!-- dumbbell, lying in front of the calendar -->
  <rect x="34" y="114" width="118" height="12" rx="6" fill="url(#bar)"/>
  <!-- left plates -->
  <rect x="14" y="94" width="22" height="52" rx="9" fill="url(#plate)"/>
  <rect x="34" y="100" width="16" height="40" rx="7" fill="url(#plate)"/>
  <ellipse cx="17" cy="120" rx="7" ry="22" fill="url(#plateFace)" opacity=".9"/>
  <rect x="19" y="99" width="4" height="22" rx="2" fill="#fff" opacity=".35"/>
  <!-- right plates -->
  <rect x="136" y="100" width="16" height="40" rx="7" fill="url(#plate)"/>
  <rect x="150" y="94" width="22" height="52" rx="9" fill="url(#plate)"/>
  <rect x="155" y="99" width="4" height="22" rx="2" fill="#fff" opacity=".35"/>
  <rect x="139" y="104" width="3" height="16" rx="1.5" fill="#fff" opacity=".3"/>
  <rect x="37" y="104" width="3" height="16" rx="1.5" fill="#fff" opacity=".3"/>
</svg>
