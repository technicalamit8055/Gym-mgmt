<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 124" width="160" height="124" fill="none">
  <defs>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fed7aa"/>
      <stop offset=".45" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset=".5" stop-color="#ffedd5"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="leafB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="tomato" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset=".5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </radialGradient>
    <radialGradient id="egg" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset=".6" stop-color="#fde047"/>
      <stop offset="1" stop-color="#eab308"/>
    </radialGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#9a3412" stop-opacity=".25"/>
      <stop offset="1" stop-color="#9a3412" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="80" cy="114" rx="62" ry="8" fill="url(#shadow)"/>

  <!-- greens piled above the rim -->
  <path d="M30 66c-6-16 6-30 22-26 4-14 22-20 32-8 12-10 32-4 32 12 14 0 22 12 16 24z" fill="url(#leafB)"/>
  <path d="M36 64c2-14 14-20 24-14-2-10 10-18 20-12" stroke="#bbf7d0" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <path d="M44 60c-10-14-2-30 14-30 0 10-4 20-14 30z" fill="url(#leafA)"/>
  <path d="M104 58c4-16 20-24 32-16-6 10-18 16-32 16z" fill="url(#leafA)"/>
  <path d="M74 52c-4-14 4-26 16-28 2 12-4 22-16 28z" fill="#22c55e"/>
  <path d="M90 26v-8M90 18c-4-4-10-4-12 0M90 18c4-4 10-4 12 0" stroke="#15803d" stroke-width="2.4" stroke-linecap="round"/>

  <!-- toppings -->
  <circle cx="58" cy="54" r="10" fill="url(#tomato)"/>
  <path d="M55 45l3 3 3-3" stroke="#15803d" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="98" cy="50" r="9" fill="url(#tomato)"/>
  <circle cx="114" cy="62" r="7" fill="url(#tomato)"/>
  <ellipse cx="80" cy="60" rx="11" ry="8" fill="#fff"/>
  <ellipse cx="80" cy="60" rx="6" ry="5" fill="url(#egg)"/>
  <rect x="38" y="60" width="16" height="6" rx="3" fill="#fb923c" transform="rotate(-20 46 63)"/>
  <rect x="120" y="44" width="14" height="5" rx="2.5" fill="#fb923c" transform="rotate(30 127 46)"/>
  <circle cx="68" cy="44" r="3" fill="#facc15"/>
  <circle cx="74" cy="40" r="2.6" fill="#facc15"/>
  <circle cx="108" cy="40" r="2.8" fill="#facc15"/>

  <!-- bowl -->
  <path d="M18 70h124c0 26-26 42-62 42S18 96 18 70z" fill="url(#bowl)"/>
  <ellipse cx="80" cy="70" rx="62" ry="7" fill="url(#rim)"/>
