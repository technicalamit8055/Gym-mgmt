<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <!-- Calendar Watermark (Soft Amber/Orange) -->
  <g opacity="0.22" fill="#f59e0b">
    <!-- Calendar Card -->
    <rect x="14" y="16" width="52" height="52" rx="8" />
  </g>
  <g opacity="0.4" fill="#ffffff">
    <!-- Binder rings -->
    <rect x="24" y="12" width="6" height="10" rx="3" fill="#f59e0b" />
    <rect x="50" y="12" width="6" height="10" rx="3" fill="#f59e0b" />
    <!-- Month header band -->
    <rect x="14" y="16" width="52" height="16" rx="6" fill="#d97706" opacity="0.3" />
    <!-- Grid dots / days -->
    <circle cx="26" cy="42" r="3.5" fill="#f59e0b" />
    <circle cx="40" cy="42" r="3.5" fill="#f59e0b" />
    <circle cx="54" cy="42" r="3.5" fill="#f59e0b" />
    <circle cx="26" cy="54" r="3.5" fill="#f59e0b" />
    <circle cx="40" cy="54" r="3.5" fill="#f59e0b" />
    <circle cx="54" cy="54" r="3.5" fill="#f59e0b" />
  </g>
</svg>
